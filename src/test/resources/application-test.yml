spring:
  datasource:
    url: jdbc:h2:mem:talkie-test;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  sql:
    init:
      mode: never

  jwt:
    secret: test-secret-key-for-jwt-please-use-32-bytes-min
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000

app:
  cors:
    allowed-origins: http://localhost:3000
